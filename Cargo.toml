[package]
name = "gugen"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Explainable materials synthesis and process planning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/gugen"
documentation = "https://docs.rs/gugen"
keywords = ["chemistry", "materials-science", "synthesis", "planning"]
categories = ["science", "command-line-utilities", "algorithms"]

[package.metadata.docs.rs]
# default = [] hides most public types (serde impls, the mikiwame adapter)
# from a default-feature doc build; build docs.rs with everything enabled.
all-features = true

[dependencies]
chematic-crystal = { version = "0.15.0", default-features = false, optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
mikiwame = { version = "0.1.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.20"

[dev-dependencies]
# Only for chematic_crystal_adapter.rs's own test fixtures, which construct
# chematic_crystal::SiteSpecies { element: chematic_core::Element::FE, .. }
# directly -- naming a foreign type by path requires the crate that defines
# it to be a direct dependency, even though production code (to_mikiwame_
# structure itself) never names `chematic_core::Element`, only calls
# `.symbol()` on a value it already has. Not gated by any feature: dev-
# dependencies never enter the published dependency graph regardless.
chematic-core = "0.15.0"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
clap = ["dep:clap"]
mikiwame = ["dep:mikiwame"]
# The bridge (src/chematic_crystal_adapter.rs) only exists to hand a real
# structure to mikiwame::analyze, so this feature pulls mikiwame in too --
# there is nothing useful gugen does with chematic-crystal on its own.
chematic_crystal = ["dep:chematic-crystal", "mikiwame"]
# Zero new dependencies: gugen never fetches Materials Project data itself
# (src/materials_project_adapter.rs takes only pre-fetched, caller-supplied
# entries) -- this feature exists purely to keep that adapter's types out of
# the default public API surface, the same opt-in convention `mikiwame`
# uses for its own (dependency-backed) adapter.
materials_project = []

[[test]]
name = "json_roundtrip"
path = "tests/json_roundtrip.rs"
required-features = ["serde"]

[[test]]
name = "materials_project_adapter"
path = "tests/materials_project_adapter.rs"
required-features = ["materials_project"]

[[test]]
name = "large_scale_benchmark"
path = "tests/large_scale_benchmark.rs"
required-features = ["serde"]

[[example]]
name = "large_scale_benchmark"
path = "examples/large_scale_benchmark.rs"
required-features = ["serde"]

[[example]]
name = "route_suitability_policy_audit"
path = "examples/route_suitability_policy_audit.rs"
required-features = ["serde"]

[[bin]]
name = "gugen"
path = "src/bin/gugen.rs"
required-features = ["serde", "clap"]
