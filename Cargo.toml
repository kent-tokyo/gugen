[package]
name = "gugen"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Explainable materials synthesis and process planning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/gugen"
documentation = "https://docs.rs/gugen"
keywords = ["chemistry", "materials-science", "synthesis", "planning"]
categories = ["science::computational-chemistry", "command-line-utilities", "algorithms"]
# Bulk literature-corpus data must never enter the published package (Phase
# 20B, owner's explicit requirement) -- only small fixtures under
# tests/fixtures/ ship. This also retroactively excludes
# benchmarks/data/kononova_sample.jsonl (472 KB, committed since Phase 11 /
# v0.2.0), which `cargo package --list` confirms was shipping in every
# published tarball through v0.3.0 with no prior exclusion.
# playground/ is a standalone browser demo (a separate Cargo crate plus a
# JS frontend) -- not library code, has no reason to ship inside the
# published gugen crate. No `include` allowlist exists on this package, so
# without this, `cargo package`/`cargo publish` would sweep it in by
# default (same reasoning as the benchmarks/data exclusion below).
#
# The example/test files below `include_str!` a benchmarks/data/*.json(l)
# file excluded above -- discovered (v0.7.0 release-prep) by actually
# building `cargo test --all-features` against the *unpacked* published
# tarball, not just the working tree, where the excluded data is still
# present on disk. This has silently broken `cargo test --all-features`
# from the published package since Phase 20B introduced the exclusion
# above (pre-dating this crate's `benchmarks/data/*.json(l)` exclusion by
# several releases) -- nobody had verified the unpacked package builds
# until now. These are internal benchmark/exploration tooling, never
# meant as library usage examples for a crates.io consumer (unlike
# examples/balance_batio3.rs), so excluding them from the package -- not
# reversing the Phase 20B data exclusion -- is the fix.
exclude = [
    "benchmarks/data/*.json",
    "benchmarks/data/*.jsonl",
    "playground/",
    "examples/exploration_grammar_audit.rs",
    "examples/exploration_two_step_arity_recall.rs",
    "examples/large_scale_benchmark.rs",
    "examples/route_suitability_policy_audit.rs",
    "tests/exploration_recall.rs",
    "tests/large_scale_benchmark.rs",
]

[package.metadata.docs.rs]
# default = [] hides most public types (serde impls, the mikiwame adapter)
# from a default-feature doc build; build docs.rs with everything enabled.
all-features = true

[dependencies]
chematic-crystal = { version = "0.15.0", default-features = false, optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
csv = { version = "1", optional = true }
mikiwame = { version = "0.1.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.20"

[dev-dependencies]
# Only for chematic_crystal_adapter.rs's own test fixtures, which construct
# chematic_crystal::SiteSpecies { element: chematic_core::Element::FE, .. }
# directly -- naming a foreign type by path requires the crate that defines
# it to be a direct dependency, even though production code (to_mikiwame_
# structure itself) never names `chematic_core::Element`, only calls
# `.symbol()` on a value it already has. Not gated by any feature: dev-
# dependencies never enter the published dependency graph regardless.
chematic-core = "0.15.0"
# Property-based tests for commercial_catalog's formula parser and
# canonical-ratio matching (Phase 22.1).
proptest = "1"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
clap = ["dep:clap"]
mikiwame = ["dep:mikiwame"]
# The bridge (src/chematic_crystal_adapter.rs) only exists to hand a real
# structure to mikiwame::analyze, so this feature pulls mikiwame in too --
# there is nothing useful gugen does with chematic-crystal on its own.
chematic_crystal = ["dep:chematic-crystal", "mikiwame"]
# Post-planning commercial-offer matching (Phase 22): CSV loading needs the
# `csv` dependency but not serde; JSON loading additionally needs `serde`
# (gated internally, see src/commercial_catalog.rs) -- this feature alone
# never pulls serde in, matching "commercial_catalog only" as its own entry
# in the feature-combination test matrix.
commercial_catalog = ["dep:csv"]
# Zero new dependencies: gugen never fetches Materials Project data itself
# (src/materials_project_adapter.rs takes only pre-fetched, caller-supplied
# entries) -- this feature exists purely to keep that adapter's types out of
# the default public API surface, the same opt-in convention `mikiwame`
# uses for its own (dependency-backed) adapter.
materials_project = []
# Bulk literature-corpus snapshot loading (src/literature_observations.rs,
# Phase 20B). Depends on "serde" (JSON parsing) but is kept as its own
# feature rather than folded into "serde" directly, matching
# "chematic_crystal"'s "feature requiring another feature" precedent --
# a caller who wants serde for e.g. JSON report output should not also
# have to compile this substantial, unrelated subsystem in.
literature_corpus = ["serde"]
# Phase 30.5: exposes a pluggable-tie-break variant of the real
# search_precursor_sets frontier (src/precursor.rs) plus a targeted trace
# type, for the fusion/frontier coupling audit's benchmark harness only.
# Zero new dependencies -- purely additive new pub items, kept out of the
# default public API surface the same way materials_project/mikiwame
# already are. search_precursor_sets itself is completely unaffected
# regardless of this feature.
search_diagnostics = []
# Phase 31 PR 3: hand-written intermediate-candidate decomposition
# grammars (src/transformation_grammar.rs). Gated as experimental,
# default off, for v0.7.0 -- the measured audit
# (docs/phase31_pr3_transformation_grammar_audit.md) found the
# grammar-only and union-with-frequency-prior policies did not recover
# any independent multi-step target beyond FrequencyPriorGenerator
# alone, so this is not yet promised stable API. Zero new dependencies,
# not wired into Planner; search_two_step_routes and
# FrequencyPriorGenerator are completely unaffected regardless of this
# feature.
experimental_grammar = []

