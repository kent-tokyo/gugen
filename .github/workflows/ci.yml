name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - run: python3 .github/scripts/test_check_oqmd_recovery.py -v
      - run: python3 benchmarks/test_fetch_oqmd_coverage.py -v
      - run: python3 benchmarks/test_analyze_oqmd_coverage_gate.py -v
